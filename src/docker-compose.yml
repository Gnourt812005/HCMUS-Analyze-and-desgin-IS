version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: npm run dev -w backend
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - dormarch-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command: npm run dev -w frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - dormarch-network

networks:
  dormarch-network:
    driver: bridge
