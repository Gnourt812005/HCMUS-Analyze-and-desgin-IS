<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng nhập - DormArch</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-surface-variant": "#434655",
              "on-primary-fixed-variant": "#003ea8",
              "primary-fixed-dim": "#b4c5ff",
              "outline-variant": "#c3c6d7",
              "primary-container": "#2563eb",
              "on-primary-container": "#eeefff",
              "surface-tint": "#0053db",
              "on-primary": "#ffffff",
              "inverse-surface": "#2e3132",
              "on-error": "#ffffff",
              "on-surface": "#191c1d",
              "secondary-fixed-dim": "#ffb95f",
              "surface-container-highest": "#e1e3e4",
              "on-primary-fixed": "#00174b",
              "on-error-container": "#93000a",
              "inverse-on-surface": "#f0f1f2",
              "on-secondary": "#ffffff",
              "secondary-fixed": "#ffddb8",
              "surface-container": "#edeeef",
              "tertiary-container": "#bc4800",
              "tertiary": "#943700",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f3f4f5",
              "on-tertiary-fixed-variant": "#7d2d00",
              "background": "#f8f9fa",
              "surface-container-high": "#e7e8e9",
              "primary-fixed": "#dbe1ff",
              "on-tertiary-container": "#ffede6",
              "secondary": "#855300",
              "on-secondary-fixed-variant": "#653e00",
              "on-tertiary": "#ffffff",
              "tertiary-fixed": "#ffdbcd",
              "secondary-container": "#fea619",
              "surface": "#f8f9fa",
              "inverse-primary": "#b4c5ff",
              "tertiary-fixed-dim": "#ffb596",
              "on-tertiary-fixed": "#360f00",
              "primary": "#004ac6",
              "outline": "#737686",
              "on-secondary-container": "#684000",
              "on-background": "#191c1d",
              "error-container": "#ffdad6",
              "surface-bright": "#f8f9fa",
              "surface-variant": "#e1e3e4",
              "surface-dim": "#d9dadb",
              "on-secondary-fixed": "#2a1700",
              "error": "#ba1a1a"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(24px);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa; /* background from theme */
        }
        h1, h2, h3 {
            font-family: 'Manrope', sans-serif;
        }
        .auth-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.06), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- TopAppBar Suppressed based on Navigation Shell Rule for Login Page -->
<!-- Manual Logo for Brand Presence -->
<header class="fixed top-0 w-full z-50 px-6 py-6 flex justify-center">
<div class="text-2xl font-black tracking-tighter text-primary">DormArch</div>
</header>
<main class="flex-grow flex items-center justify-center p-6 relative overflow-hidden">
<!-- Abstract Architectural Background Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary/5 rounded-full blur-[120px]"></div>
<!-- Auth Card -->
<div class="w-full max-w-md bg-surface-container-lowest auth-shadow rounded-xl overflow-hidden border border-outline-variant/10 relative z-10">
<!-- Tabs -->
<div class="flex border-b border-surface-container-high">
<button class="flex-1 py-4 text-sm font-semibold text-primary border-b-2 border-primary transition-all duration-200">
                    Đăng nhập
                </button>
<button class="flex-1 py-4 text-sm font-medium text-on-surface-variant hover:bg-surface-container-low transition-all duration-200">
                    Đăng ký
                </button>
</div>
<div class="p-8">
<div class="mb-8">
<h2 class="text-2xl font-extrabold text-on-surface tracking-tight mb-2">Chào mừng trở lại</h2>
<p class="text-on-surface-variant text-sm">Vui lòng nhập thông tin để truy cập vào căn hộ của bạn.</p>
</div>
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant" for="email">Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-surface-container-high border-none rounded-lg focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all text-sm placeholder:text-outline" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant" for="password">Mật khẩu</label>
<a class="text-xs font-semibold text-primary hover:underline transition-all" href="#">Quên mật khẩu?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 bg-surface-container-high border-none rounded-lg focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all text-sm placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full py-4 bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold rounded-lg text-sm tracking-wide shadow-lg shadow-primary/20 hover:brightness-110 active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2" type="submit">
<span>Đăng nhập</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Divider -->
<!-- Social Login -->
</form>
</div>
<!-- Footer Section of Card -->
<div class="bg-surface-container-low p-6 text-center">
<p class="text-sm text-on-surface-variant">
                    Bạn chưa có tài khoản? 
                    <a class="text-primary font-bold hover:underline transition-all" href="#">Tạo tài khoản mới</a>
</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-8 mt-auto bg-slate-50 border-t border-slate-200/15 flex flex-col md:flex-row justify-between items-center px-8 gap-4">
<p class="font-inter text-xs tracking-wide uppercase text-slate-400">© 2024 DormArch Digital Architecture. All rights reserved.</p>
<div class="flex gap-6">
<a class="font-inter text-xs tracking-wide uppercase text-slate-400 hover:text-blue-700 transition-all" href="#">Privacy Policy</a>
<a class="font-inter text-xs tracking-wide uppercase text-slate-400 hover:text-blue-700 transition-all" href="#">Terms of Service</a>
<a class="font-inter text-xs tracking-wide uppercase text-slate-400 hover:text-blue-700 transition-all" href="#">Contact Support</a>
</div>
</footer>
</body></html>
