<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DormArch - Đăng ký tài khoản</title>
<!-- Google Fonts: Manrope & Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-surface-variant": "#434655",
              "on-primary-fixed-variant": "#003ea8",
              "primary-fixed-dim": "#b4c5ff",
              "outline-variant": "#c3c6d7",
              "primary-container": "#2563eb",
              "on-primary-container": "#eeefff",
              "surface-tint": "#0053db",
              "on-primary": "#ffffff",
              "inverse-surface": "#2e3132",
              "on-error": "#ffffff",
              "on-surface": "#191c1d",
              "secondary-fixed-dim": "#ffb95f",
              "surface-container-highest": "#e1e3e4",
              "on-primary-fixed": "#00174b",
              "on-error-container": "#93000a",
              "inverse-on-surface": "#f0f1f2",
              "on-secondary": "#ffffff",
              "secondary-fixed": "#ffddb8",
              "surface-container": "#edeeef",
              "tertiary-container": "#bc4800",
              "tertiary": "#943700",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f3f4f5",
              "on-tertiary-fixed-variant": "#7d2d00",
              "background": "#f8f9fa",
              "surface-container-high": "#e7e8e9",
              "primary-fixed": "#dbe1ff",
              "on-tertiary-container": "#ffede6",
              "secondary": "#855300",
              "on-secondary-fixed-variant": "#653e00",
              "on-tertiary": "#ffffff",
              "tertiary-fixed": "#ffdbcd",
              "secondary-container": "#fea619",
              "surface": "#f8f9fa",
              "inverse-primary": "#b4c5ff",
              "tertiary-fixed-dim": "#ffb596",
              "on-tertiary-fixed": "#360f00",
              "primary": "#004ac6",
              "outline": "#737686",
              "on-secondary-container": "#684000",
              "on-background": "#191c1d",
              "error-container": "#ffdad6",
              "surface-bright": "#f8f9fa",
              "surface-variant": "#e1e3e4",
              "surface-dim": "#d9dadb",
              "on-secondary-fixed": "#2a1700",
              "error": "#ba1a1a"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-effect {
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }
      .signature-gradient {
        background: linear-gradient(135deg, #004ac6 0%, #2563eb 100%);
      }
      .ghost-border {
        border: 1px solid rgba(195, 198, 215, 0.15);
      }
    </style>
</head>
<body class="bg-background font-body text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar - Suppressed Shell logic applies here for transactional flow (no nav items) -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl">
<div class="flex justify-between items-center px-6 py-4 max-w-7xl mx-auto">
<div class="text-2xl font-black tracking-tighter text-blue-700 dark:text-blue-500 font-headline">
                DormArch
            </div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-slate-500 hover:text-blue-600 transition-colors cursor-pointer" data-icon="help_outline">help_outline</span>
</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-4 pt-24 pb-12 relative overflow-hidden">
<!-- Abstract Architectural Background Element -->
<div class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] rounded-full bg-primary-fixed/30 blur-[120px] -z-10"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[400px] h-[400px] rounded-full bg-secondary-fixed/20 blur-[100px] -z-10"></div>
<!-- Auth Card -->
<div class="w-full max-w-md bg-surface-container-lowest shadow-[0_32px_64px_-12px_rgba(25,28,29,0.06)] rounded-xl overflow-hidden transition-all duration-300">
<!-- Tabs Navigation -->
<div class="flex border-b border-surface-container">
<a class="flex-1 py-5 text-center font-headline font-bold text-sm tracking-tight text-slate-500 hover:text-blue-700 transition-colors" href="#">
                    Đăng nhập
                </a>
<div class="flex-1 py-5 text-center font-headline font-bold text-sm tracking-tight text-blue-700 relative">
                    Đăng ký
                    <div class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-700"></div>
</div>
</div>
<div class="p-8 md:p-10">
<div class="mb-8">
<h1 class="font-headline text-3xl font-extrabold tracking-tighter text-on-surface mb-2">Bắt đầu ngay</h1>
<p class="text-on-surface-variant text-sm">Kiến tạo không gian lưu trú hiện đại của bạn.</p>
</div>
<!-- Registration Form -->
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label text-[0.6875rem] uppercase tracking-[0.05em] text-on-surface-variant font-semibold">Email</label>
<div class="relative group">
<input class="w-full bg-surface-container-high border-none rounded-lg px-4 py-3.5 text-sm focus:ring-0 focus:bg-surface-container-lowest transition-all duration-200 peer outline-none ring-2 ring-transparent focus:ring-primary/10" placeholder="example@email.com" type="email"/>
<div class="absolute inset-0 border-2 border-primary opacity-0 peer-focus:opacity-15 rounded-lg pointer-events-none transition-opacity duration-200"></div>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="font-label text-[0.6875rem] uppercase tracking-[0.05em] text-on-surface-variant font-semibold">Mật khẩu</label>
<div class="relative group">
<input class="w-full bg-surface-container-high border-none rounded-lg px-4 py-3.5 text-sm focus:ring-0 focus:bg-surface-container-lowest transition-all duration-200 peer outline-none ring-2 ring-transparent focus:ring-primary/10" placeholder="••••••••" type="password"/>
<div class="absolute inset-0 border-2 border-primary opacity-0 peer-focus:opacity-15 rounded-lg pointer-events-none transition-opacity duration-200"></div>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer text-[20px]" data-icon="visibility">visibility</span>
</div>
</div>
<!-- Confirm Password Input -->
<div class="space-y-2">
<label class="font-label text-[0.6875rem] uppercase tracking-[0.05em] text-on-surface-variant font-semibold">Xác nhận mật khẩu</label>
<div class="relative group">
<input class="w-full bg-surface-container-high border-none rounded-lg px-4 py-3.5 text-sm focus:ring-0 focus:bg-surface-container-lowest transition-all duration-200 peer outline-none ring-2 ring-transparent focus:ring-primary/10" placeholder="••••••••" type="password"/>
<div class="absolute inset-0 border-2 border-primary opacity-0 peer-focus:opacity-15 rounded-lg pointer-events-none transition-opacity duration-200"></div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full signature-gradient text-white py-4 rounded-lg font-headline font-bold text-sm tracking-tight shadow-lg shadow-primary/20 hover:brightness-110 active:scale-95 transition-all duration-200 mt-8" type="submit">
                        Đăng ký
                    </button>
</form>
</div>
</div>
</main>
<!-- Footer - Mapping from Shared Components JSON -->
<footer class="w-full py-8 mt-auto bg-slate-50 dark:bg-slate-900 border-t border-slate-200/15 dark:border-slate-800/15">
<div class="flex flex-col md:flex-row justify-between items-center px-8 gap-4 max-w-7xl mx-auto">
<p class="font-inter text-xs tracking-wide uppercase text-slate-400 dark:text-slate-500">
                © 2024 DormArch Digital Architecture. All rights reserved.
            </p>
<div class="flex gap-6">
<a class="font-inter text-[10px] tracking-wide uppercase text-slate-400 dark:text-slate-500 hover:text-blue-700 dark:hover:text-blue-400 transition-all opacity-80 hover:opacity-100" href="#">Privacy Policy</a>
<a class="font-inter text-[10px] tracking-wide uppercase text-slate-400 dark:text-slate-500 hover:text-blue-700 dark:hover:text-blue-400 transition-all opacity-80 hover:opacity-100" href="#">Terms of Service</a>
<a class="font-inter text-[10px] tracking-wide uppercase text-slate-400 dark:text-slate-500 hover:text-blue-700 dark:hover:text-blue-400 transition-all opacity-80 hover:opacity-100" href="#">Contact Support</a>
</div>
</div>
</footer>
</body></html>
